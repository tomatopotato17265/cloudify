plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cloudify" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	// Guava, failureaccess, and gson are excluded here since Minecraft already bundles matching versions of all three.
	transitiveInclude {
		exclude group: "com.google.guava", module: "guava"
		exclude group: "com.google.guava", module: "failureaccess"
		exclude group: "com.google.code.gson", module: "gson"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("com.google.api-client:google-api-client:${project.google_api_client_version}") {
		exclude group: "com.google.guava", module: "guava"
	}
	transitiveInclude "com.google.api-client:google-api-client:${project.google_api_client_version}"
	implementation("com.google.oauth-client:google-oauth-client:${project.google_oauth_client_version}") {
		exclude group: "com.google.guava", module: "guava"
	}
	transitiveInclude "com.google.oauth-client:google-oauth-client:${project.google_oauth_client_version}"
	implementation("com.google.apis:google-api-services-drive:${project.google_api_services_drive_version}") {
		exclude group: "com.google.guava", module: "guava"
	}
	transitiveInclude "com.google.apis:google-api-services-drive:${project.google_api_services_drive_version}"
}

afterEvaluate {
	// `transitiveInclude` resolves independently of the actual game/mod runtime classpath. This forces it defer to the classpath's choices.
	configurations.transitiveInclude.shouldResolveConsistentlyWith(configurations.clientRuntimeClasspath)
	configurations.transitiveInclude.resolvedConfiguration.resolvedArtifacts.each {
		dependencies.include(it.moduleVersion.id.toString())
	}
}

def secretsFile = file("secrets.properties")
if (!secretsFile.exists()) {
	throw new GradleException("secrets.properties not found. Copy secrets.properties.example to secrets.properties and fill in your Google OAuth credentials.")
}
def secrets = new Properties()
secretsFile.withInputStream { secrets.load(it) }

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "googleDriveClientId", secrets.getProperty("googleDriveClientId")
	inputs.property "googleDriveClientSecret", secrets.getProperty("googleDriveClientSecret")

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	filesMatching("cloudify-google-drive.properties") {
		expand(
			"googleDriveClientId": secrets.getProperty("googleDriveClientId"),
			"googleDriveClientSecret": secrets.getProperty("googleDriveClientSecret")
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}